# Build a fully static Linux binary (musl) and publish it as a GitHub release.
#
# To release:  bump `version` in Cargo.toml, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Unit tests
        run: cargo test --release --target $TARGET

      - name: Build static binary
        run: cargo build --release --target $TARGET

      - name: Package
        run: |
          bin=target/$TARGET/release/diffreps
          strip "$bin"
          # `file` says "static-pie linked" or "statically linked"; a dynamic binary would say "dynamically linked"
          file "$bin" | grep -Eq "static(-pie|ally) linked" || { file "$bin"; echo "binary is not static" >&2; exit 1; }
          name=diffreps-$GITHUB_REF_NAME-$TARGET
          mkdir "$name"
          cp "$bin" README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
